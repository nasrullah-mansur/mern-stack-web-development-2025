<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css">
    <title>Responsive Practice</title>
    
  </head>
  <body>
    <header>
      <h1>Responsive Practice Page</h1>
    </header>

    <div class="container">
      <div class="column">
        <h2>Column One</h2>
        <p>
          This column contains some text to demonstrate a responsive layout

        </p>
        <img
          src="https://icon2.cleanpng.com/20231210/piv/transparent-smiley-face-yellow-smiley-face-with-closed-eyes-1710979323276.webp"
          alt="Placeholder"
          class="responsive"
        />
      </div>
      <div class="column">
        <h2>Column Two</h2>
        <p>
          This is the second column. Resize the screen to see how the layout
          changes.
        </p>
        <img
          src="https://icon2.cleanpng.com/lnd/20240531/qzv/ayx4q5edv.webp"
          alt="Placeholder"
          class="responsive"
        />
      </div>
    </div>

    <footer>&copy; 2025 Responsive Design Practice</footer>

</html>
